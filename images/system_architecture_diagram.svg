<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720">
  <rect width="1400" height="720" fill="#f8fbff"/>
  <text x="700" y="60" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#16324f">Agentic Retrieval-Augmented Generation for Reliable QA</text>
  <text x="700" y="92" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#4f6477">High-level architecture of the multi-agent reliability framework</text>

  <rect x="90" y="150" width="220" height="90" rx="14" fill="#dfefff" stroke="#3b6ea8" stroke-width="2"/>
  <text x="200" y="188" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#16324f">User Query</text>
  <text x="200" y="216" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4f6477">Question input</text>

  <rect x="380" y="150" width="220" height="90" rx="14" fill="#e8f6ea" stroke="#2f7d32" stroke-width="2"/>
  <text x="490" y="188" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#16324f">Response</text>
  <text x="490" y="216" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#16324f">Generator</text>

  <rect x="670" y="150" width="220" height="90" rx="14" fill="#fff3e0" stroke="#c77700" stroke-width="2"/>
  <text x="780" y="188" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#16324f">Retrieval Agent</text>
  <text x="780" y="216" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4f6477">Fetch supporting evidence</text>

  <rect x="950" y="150" width="220" height="90" rx="14" fill="#f3e8ff" stroke="#7b3f9d" stroke-width="2"/>
  <text x="1060" y="188" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#16324f">Knowledge Base</text>
  <text x="1060" y="216" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4f6477">External evidence source</text>

  <line x1="310" y1="195" x2="380" y2="195" stroke="#4f6477" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="600" y1="195" x2="670" y2="195" stroke="#4f6477" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="890" y1="195" x2="950" y2="195" stroke="#4f6477" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="240" y="330" width="180" height="90" rx="14" fill="#fde2e2" stroke="#b33a3a" stroke-width="2"/>
  <text x="330" y="368" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#16324f">Reflection</text>
  <text x="330" y="396" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#16324f">Agent</text>

  <rect x="440" y="330" width="180" height="90" rx="14" fill="#fde2e2" stroke="#b33a3a" stroke-width="2"/>
  <text x="530" y="368" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#16324f">Fact Checker</text>
  <text x="530" y="396" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#16324f">Agent</text>

  <rect x="640" y="330" width="180" height="90" rx="14" fill="#fde2e2" stroke="#b33a3a" stroke-width="2"/>
  <text x="730" y="368" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#16324f">Reason</text>
  <text x="730" y="396" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#16324f">Checker</text>

  <rect x="840" y="330" width="180" height="90" rx="14" fill="#fde2e2" stroke="#b33a3a" stroke-width="2"/>
  <text x="930" y="368" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#16324f">Consistency</text>
  <text x="930" y="396" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#16324f">Checker</text>

  <line x1="490" y1="240" x2="330" y2="330" stroke="#4f6477" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="490" y1="240" x2="530" y2="330" stroke="#4f6477" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="490" y1="240" x2="730" y2="330" stroke="#4f6477" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="490" y1="240" x2="930" y2="330" stroke="#4f6477" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="500" y="500" width="300" height="100" rx="16" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="650" y="540" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#16324f">Confidence Aggregator</text>
  <text x="650" y="571" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4f6477">Combine evidence and assign reliability</text>

  <line x1="330" y1="420" x2="580" y2="500" stroke="#4f6477" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="530" y1="420" x2="620" y2="500" stroke="#4f6477" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="730" y1="420" x2="680" y2="500" stroke="#4f6477" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="930" y1="420" x2="760" y2="500" stroke="#4f6477" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="950" y="500" width="250" height="100" rx="16" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="1075" y="540" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#16324f">Response Improver</text>
  <text x="1075" y="571" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4f6477">Refine low-confidence answer</text>

  <line x1="800" y1="550" x2="950" y2="550" stroke="#4f6477" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="560" y="640" width="220" height="60" rx="14" fill="#fff8e1" stroke="#b8860b" stroke-width="2"/>
  <text x="670" y="678" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#16324f">Final Answer</text>

  <line x1="650" y1="600" x2="650" y2="640" stroke="#4f6477" stroke-width="3" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#4f6477"/>
    </marker>
  </defs>
</svg>
